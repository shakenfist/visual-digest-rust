name: CI

# Documentation cannot affect the build, so the check_paths job below
# skips the build for a change touching only docs/. The filter is a job
# rather than a trigger-level paths-ignore so the workflow still runs on
# documentation-only pull requests: the automated reviewer should see
# those, and a skipped job still reports, so this stays safe if a check
# here is ever made required. Keep the skip list in sync with
# codeql-analysis.yml. The content scanners in content-scan.yml
# deliberately run on everything.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # For workflow_dispatch the filter step is skipped and the output
  # defaults to true, so a manual run (and so pr-retest.yml) always
  # builds.
  check_paths:
    name: Check paths
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    # paths-filter lists a pull request's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # By default a file matches if it matches ANY pattern, which
          # makes '**' match everything and defeats the exclusion.
          # 'every' requires a file to match ALL patterns.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'

  check:
    name: Lint and build
    needs: [check_paths]
    if: needs.check_paths.outputs.code_changed != 'false'
    # Builds the devcontainer image and then compiles the workspace three
    # times (all features, and the library alone for build and test).
    # m is 4 vCPU; xs, the conductor's default, would be one.
    runs-on: [self-hosted, vm, debian-13-docker, m]
    # A backstop above the sum of the per-step timeouts below.
    timeout-minutes: 70

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Build Docker image
        run: docker build -t visual-digest-rust-dev .devcontainer/
        timeout-minutes: 10

      - name: Run rustfmt and clippy
        run: ./scripts/check-rust.sh check
        timeout-minutes: 10

      - name: Run tests (all features)
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$PWD/.cargo-cache/registry":/build/.cargo/registry \
            -v "$PWD/.cargo-cache/git":/build/.cargo/git \
            -w /workspace \
            -u "$(id -u):$(id -g)" \
            -e HOME=/build \
            visual-digest-rust-dev \
            cargo test --workspace --all-features
        timeout-minutes: 10

      # Per-package no_std smoke. This MUST be `-p shakenfist-visual-digest`,
      # not `--workspace`, because Cargo feature unification through
      # `digest-decode`'s path dependency on the library with the `cli`
      # feature would silently re-enable `decode`/`qr`/`serde` even under
      # `--no-default-features` at the workspace level — defeating the
      # check. The per-package form is what actually proves the library
      # compiles without `std` (load-bearing for Sextant's UEFI consumer).
      - name: Build library alone (no default features, real no_std smoke)
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$PWD/.cargo-cache/registry":/build/.cargo/registry \
            -v "$PWD/.cargo-cache/git":/build/.cargo/git \
            -w /workspace \
            -u "$(id -u):$(id -g)" \
            -e HOME=/build \
            visual-digest-rust-dev \
            cargo build -p shakenfist-visual-digest --no-default-features
        timeout-minutes: 10

      # Library-alone tests in no_std mode. These exercise the 13 encoder
      # tests and the 3 golden-fixture tests without the decoder/qr/serde
      # features pulled in. If something accidentally starts depending on
      # `std` or `alloc` in the encoder hot path, this step fails.
      - name: Test library alone (no default features)
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$PWD/.cargo-cache/registry":/build/.cargo/registry \
            -v "$PWD/.cargo-cache/git":/build/.cargo/git \
            -w /workspace \
            -u "$(id -u):$(id -g)" \
            -e HOME=/build \
            visual-digest-rust-dev \
            cargo test -p shakenfist-visual-digest --no-default-features
        timeout-minutes: 10

  automated_reviewer:
    name: Automated reviewer
    # The needs: list and the if: below are the "review only once CI
    # has passed" gate. always() lets the reviewer run when check was
    # skipped for a documentation-only change, while a failed or
    # cancelled check still holds it back. Everything else about the
    # reviewer -- runner, timeout,
    # fork restriction, bot-commit check -- lives in the shared workflow
    # so it stays in step with the rest of the fleet. It reads no
    # secrets, so none are passed.
    needs: [check_paths, check]
    if: >-
      always()
      && needs.check_paths.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.check.result)
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
