name: CodeQL

permissions: {}

# Documentation changes cannot affect code analysis, so skip them. CodeQL
# is not a required check, so it keeps a workflow-level paths-ignore
# rather than a check_paths job. Keep the path list in sync with ci.yml.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 17 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, static]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-analyze
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
