name: Content scanners

# Scanners that read the human-written text in the repository, kept
# apart from ci.yml so they are never path filtered: a problem lands in
# documentation or agent context as easily as in code, so these run on
# every pull request, including documentation-only ones.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lints the agent context by running the pre-commit hook rather than
  # invoking skillsaw directly, so .pre-commit-config.yaml's rev is the
  # only place the version is written down and Renovate's pre-commit
  # manager keeps the two from drifting apart.
  skillsaw:
    name: Lint agent context
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-skillsaw
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Into a venv, not the system python: the runners enforce PEP 668,
      # so a bare `pip install` is refused.
      - name: Install pre-commit
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv-skillsaw"
          "${RUNNER_TEMP}/venv-skillsaw/bin/pip" install --quiet \
              --disable-pip-version-check pre-commit
          echo "${RUNNER_TEMP}/venv-skillsaw/bin" >> "${GITHUB_PATH}"

      # Just this hook: the others run in ci.yml.
      - name: Run skillsaw
        run: pre-commit run skillsaw --all-files

  # gitleaks is pinned by version and sha256 rather than taken from the
  # distribution: its config schema and rule set change between
  # releases, and a detector which silently changes behaviour under us
  # is worse than none. 8.16.0 matches shakenfist/shakenfist. To move
  # the pin, run tools/gitleaks-scan.sh against the new version locally
  # first and check the positive control still passes.
  gitleaks:
    name: Credential scan
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
      cancel-in-progress: true
    steps:
      # fetch-depth: 0 is load bearing: the scan covers every commit
      # reachable from HEAD, and a secret committed then reverted still
      # needs rotating. The script refuses a shallow clone.
      - name: Checkout code with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.16.0
          GITLEAKS_SHA256: f8d4fabedaeaabd2a3e7e7b96394b8ddeff0be32941a1719aedee08fc8678601
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSLo "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "${base}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan history for credentials
        run: tools/gitleaks-scan.sh --gitleaks "${RUNNER_TEMP}/gitleaks"
