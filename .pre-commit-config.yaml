# Pre-commit hooks for visual-digest-rust
#
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# For actionlint, install the binary:
#   - macOS: brew install actionlint
#   - Linux: https://github.com/rhysd/actionlint/releases

repos:
  # GitHub Actions workflow linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        description: Static checker for GitHub Actions workflow files

  # Trailing whitespace, end-of-file, basic hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Rust formatting and linting via Docker
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        description: Run rustfmt --check and clippy -D warnings via Docker
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$
